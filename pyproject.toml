[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "golillas"
version = "0.1.0"
description = "Inspección visual de golillas con visión clásica medida paso a paso, y simulación de una línea de producción que retira las malas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Camilo Soto Villegas" }]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "imageio>=2.33",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
red = ["torch>=2.2", "torchvision>=0.17"]
# ADR 0017 (e13): versiones fijas; torch 2.14 + CUDA 12.6 es la última con kernels para la GTX 1060
sota = ["anomalib==2.7.1", "torch==2.14.1", "torchvision==0.29.1"]

[tool.setuptools]
packages = ["golillas", "golillas.metodos"]

[tool.setuptools.package-data]
golillas = ["calibracion.json", "tipos/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E741", "B905"]  # zip sin strict: en los scripts las listas siempre calzan

[tool.pytest.ini_options]
testpaths = ["tests"]
